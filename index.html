
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصتي - تشغيل الكاميرا</title>
  <style>
    body {
      font-family: Arial;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px;
    }
    button {
      padding: 14px 25px;
      background: #1685ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      margin: 10px;
    }
    video {
      width: 100%;
      max-width: 450px;
      border-radius: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>مرحباً بك في منصتي</h1>
  <p>اضغط على الزر للسماح بتشغيل الكاميرا الأمامية.</p>

  <button onclick="startCamera()">تشغيل الكاميرا</button>
  <button onclick="stopCamera()">إيقاف الكاميرا</button>

  <video id="camera" autoplay playsinline></video>

  <script>
    let stream = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        document.getElementById("camera").srcObject = stream;
      } catch (error) {
        alert("لم يتم السماح بتشغيل الكاميرا.");
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        document.getElementById("camera").srcObject = null;
      }
    }
  </script>

</body>
</html>
